# Render Blueprint for the Garg Jewellers backend (FastAPI).
# In Render: New → Blueprint → connect this repo. Set the `sync: false` vars
# in the dashboard (they're secrets). Frontend deploys separately on Vercel.
services:
  - type: web
    name: garg-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # AI background removal needs ~1GB RAM — off on the free plan.
      - key: ENABLE_BG_REMOVAL
        value: "false"
      # Secrets / per-deploy values — set these in the Render dashboard:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # from Neon
        sync: false
      - key: FRONTEND_ORIGIN       # your Vercel URL, e.g. https://garg.vercel.app
        sync: false
      - key: PUBLIC_BASE_URL       # this service's URL, e.g. https://garg-backend.onrender.com
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
